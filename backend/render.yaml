services:
  - type: web
    name: akshitha-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_NAME
        value: token
      - key: CLIENT_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000,https://akshita-jade.vercel.app,https://akshitha-edutech.vercel.app
        sync: false
